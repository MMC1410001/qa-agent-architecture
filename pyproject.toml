[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-os"
version = "1.0.0"
description = "AI-Powered QA Operating System - Intelligent test automation orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "QA-OS Team", email = "dev@qa-os.io"}
]
keywords = ["qa", "testing", "automation", "ai", "llm", "quality-assurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "aioredis>=2.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.0",
    "pydantic-extra-types>=2.0.0",
    "typing-extensions>=4.8.0",
    "structlog>=23.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
    "mypy>=1.7.0",
    "flake8>=6.1.0",
    "ruff>=0.1.0",
]

providers = [
    "anthropic>=0.7.0",
    "openai>=1.0.0",
]

integrations = [
    "jira>=3.13.0",
    "pygithub>=2.1.0",
    "slack-sdk>=3.26.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/qa-os/qa-os"
Documentation = "https://qa-os.readthedocs.io"
Repository = "https://github.com/qa-os/qa-os.git"
"Bug Tracker" = "https://github.com/qa-os/qa-os/issues"

[tool.setuptools]
packages = ["config", "src"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["config", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --disable-warnings"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "normal"

[tool.pylint.messages_control]
disable = [
    "C0330",
    "C0326",
    "missing-module-docstring",
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
